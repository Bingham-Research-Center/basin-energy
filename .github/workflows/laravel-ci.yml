name: Laravel CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  laravel-tests:
    name: Laravel Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: basinenergy_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false

      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: basinenergy_test
      DB_USERNAME: root
      DB_PASSWORD: root

      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, curl, fileinfo, gd, intl, xml, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP syntax
        run: |
          find app routes database tests -type f -name "*.php" -print0 | \
          xargs -0 -n1 php -l

      - name: Check Laravel routes
        run: php artisan route:list > /dev/null

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify Google OAuth popup session/redirect behavior
        run: |
          node --check public/frontend/js/google-oauth-popup.js
          node tests/js/google-oauth-popup.test.js

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run production

      - name: Verify compiled research chart modules
        run: |
          test -s public/js/research-data.js
          node --check public/js/research-data.js
          grep -q 'emissionTrendsChartRoot' public/js/research-data.js
          grep -q 'producedWaterFluxRoot' public/js/research-data.js
          grep -q 'subsurfaceLeakDashboard' public/js/research-data.js
          grep -q 'oilWellPadDashboard' public/js/research-data.js

      - name: Verify admin overview and bundled Carbon Mapper assets
        run: |
          test -s public/js/backend.js
          test -s public/js/research-data.js
          grep -q 'adminOzoneTrend' public/js/backend.js
          grep -q 'adminWeatherSummary' public/js/backend.js
          grep -q 'markerClusterGroup' public/js/research-data.js
          grep -q 'leaflet-container' public/css/backend.css

      - name: Verify full-width dashboard visualization CSS
        run: |
          grep -Fq '.dashboard-page-pro.dashboard-fill-page' public/css/backend.css
          grep -Fq '.dashboard-page-pro.dashboard-fill-page' public/css/frontend.css

      - name: Check shared dashboard theme script
        run: node --check public/js/dashboard-theme.js

      - name: Check Broadcast editor syntax
        run: |
          node --check public/js/broadcast-editor.js
          node --check public/js/broadcast-delivery-progress.js

      - name: Verify Laravel Mix manifest
        run: test -f public/mix-manifest.json

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit

      # CI normally installs dev packages for PHPUnit, whereas production
      # often uses --no-dev. Verify critical runtime libraries remain present.
      - name: Verify production Composer dependency availability
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          php -r 'require "vendor/autoload.php"; if (!class_exists("HTMLPurifier_Config") || !class_exists("HTMLPurifier")) { fwrite(STDERR, "HTMLPurifier is missing from production Composer dependencies\\n"); exit(1); }'