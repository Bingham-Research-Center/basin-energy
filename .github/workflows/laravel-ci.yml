name: Laravel CI

on:
  pull_request:
    branches:
      - devel
      - master

  push:
    branches:
      - devel
      - master

permissions:
  contents: read

jobs:
  laravel-tests:
    name: Laravel Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: basinenergy_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false

      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: basinenergy_test
      DB_USERNAME: root
      DB_PASSWORD: root

      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, curl, fileinfo, gd, intl, xml, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP syntax
        run: |
          find app routes database tests -type f -name "*.php" -print0 | \
          xargs -0 -n1 php -l

      - name: Check Laravel routes
        run: php artisan route:list > /dev/null

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit